name: Submission Verification & Quality Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pandas pytest

      - name: Run Ruff Linter
        run: ruff check solution/src/

      - name: Run Mypy Type Checker
        run: mypy solution/src/ --ignore-missing-imports

      - name: Run Full Submission Verification Suite
        run: python scripts/verify_submission.py
